<div class="cz-galeria">
  <style>
    .cz-galeria{
      box-sizing:border-box;background:var(--cz-cream,#FAF6F0);
      font-family:var(--cz-sans,'Jost',sans-serif);padding:52px 20px;text-align:center;
    }
    .cz-galeria *,.cz-galeria *::before,.cz-galeria *::after{box-sizing:border-box}
    .cz-galeria__eyebrow{
      margin:0 0 10px;font-size:12px;font-weight:700;letter-spacing:.16em;
      text-transform:uppercase;color:var(--cz-gold,#B8873B);
    }
    .cz-galeria__title{
      margin:0 0 12px;font-family:var(--cz-serif,serif);font-size:30px;
      font-weight:600;line-height:1.18;color:var(--cz-ink,#2A1F19);
    }
    .cz-galeria__text{
      margin:0 auto 22px;max-width:520px;font-size:15px;line-height:1.7;color:var(--cz-ink-soft,#6B5D52);
    }
    .cz-galeria__grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
    .cz-galeria__grid img{
      width:100%;height:100%;aspect-ratio:1/1;object-fit:cover;border-radius:14px;display:block;
    }
  </style>

  <p class="cz-galeria__eyebrow">Hecho para durar</p>
  <h2 class="cz-galeria__title">Cada detalle, cuidado a mano</h2>
  <p class="cz-galeria__text">Cuero Dacota seleccionado pieza por pieza, cortado y cosido a mano. Por eso no hay dos sets exactamente iguales.</p>

  <div class="cz-galeria__grid">
    <img src="https://cdn.shopify.com/s/files/1/0996/2271/5697/files/ChatGPTImage2deset.de2026_15_20_49.png?v=1788374884&width=800" alt="Los tres sets de morral y cosmetiquera Velez en una terraza" loading="lazy" width="800" height="800">
    <img src="https://cdn.shopify.com/s/files/1/0996/2271/5697/files/ChatGPTImage2deset.de2026_15_45_35.png?v=1788374883&width=800" alt="Morral y cosmetiquera en Cuero Dacota color cognac" loading="lazy" width="800" height="800">
    <img src="https://cdn.shopify.com/s/files/1/0996/2271/5697/files/ChatGPTImage2deset.de2026_15_45_41.png?v=1788374883&width=800" alt="Morral y cosmetiquera en Cuero Dacota color café" loading="lazy" width="800" height="800">
    <img src="https://cdn.shopify.com/s/files/1/0996/2271/5697/files/ChatGPTImage2deset.de2026_15_45_49.png?v=1788374883&width=800" alt="Morral y cosmetiquera en Cuero Dacota color negro" loading="lazy" width="800" height="800">
  </div>
</div>
