<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cz-cream:#FAF6F0;
    --cz-ink:#2A1F19;
    --cz-ink-soft:#6B5D52;
    --cz-gold:#B8873B;
    --cz-gold-light:#E0B766;
    --cz-green:#16A34A;
    --cz-green-dark:#12833B;
    --cz-cream-text:#F3E7D6;
    --cz-cream-text-soft:#C4B4A3;
    --cz-serif:'Cormorant Garamond',Georgia,serif;
    --cz-sans:'Jost',system-ui,sans-serif;
  }

  /* Botao de compra — abre o formulario do Releasit COD.
     Mesmo desenho do botao nativo do app: icone + titulo + subtitulo. */
  .cz-cod{
    display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;max-width:420px;margin:0 auto;
    background:var(--cz-green,#16A34A);color:#fff;
    font-family:var(--cz-sans,'Jost',sans-serif);
    padding:14px 22px;border:0;border-radius:10px;cursor:pointer;
    text-align:center;text-decoration:none;
    -webkit-appearance:none;appearance:none;
  }
  .cz-cod:hover{background:var(--cz-green-dark,#12833B)}
  .cz-cod__icon{width:24px;height:24px;flex:0 0 auto;fill:currentColor}
  .cz-cod__label{font-size:17px;font-weight:600;letter-spacing:.05em;line-height:1.2}
  .cz-cod__sub{display:block;margin:3px 0 0;font-size:12px;font-weight:400;opacity:.9;letter-spacing:0}
</style>

<script>
/* =====================================================================
   Abre o formulario do Releasit COD a partir de qualquer botao que
   tenha o atributo data-cz-cod.

   COMO FUNCIONA
   Procura o botao do proprio Releasit no DOM e repassa o clique.
   Nao usa nenhuma API do app — so o DOM que ele renderiza.

   A busca e por PREFIXO (rsi_), nao por um id fixo, porque o botao
   muda de id conforme onde o app o renderiza: #rsi_buy_now_button no
   formulario de produto, outro id no botao fixo do rodape. Qualquer
   um serve: todos abrem o mesmo formulario.

   NAO usamos as classes (sc-iJKPHa, jsUlpn): sao hashes de
   styled-components e mudam a cada versao do app.

   Se nada for encontrado, rola ate a caixa de compra — nunca fica morto.

   DIAGNOSTICO: se o botao nao abrir o popup, rode no console da pagina:
     copy([...document.querySelectorAll('[id*="rsi"],[class*="rsi"]')]
       .map(e => e.tagName + '#' + e.id + '.' + e.className).join('\n'))
   e me mande o resultado.
   ===================================================================== */
(function () {
  'use strict';

  function ehClicavel(n){
    return n.tagName === 'BUTTON' || n.tagName === 'A' || n.getAttribute('role') === 'button';
  }

  function findReleasitButton(){
    // 1. o id visto no formulario de produto
    var direto = document.querySelector('#rsi_buy_now_button');
    if (direto) return direto;

    // 2. qualquer elemento do Releasit (prefixo rsi_) que seja clicavel,
    //    ou que contenha um botao — cobre o botao fixo do rodape
    var nodes = document.querySelectorAll('[id^="rsi_"],[id^="rsi-"],[class*="rsi_"],[class*="rsi-"]');
    for (var i = 0; i < nodes.length; i++){
      var n = nodes[i];
      if (n.hasAttribute('data-cz-cod') || n.closest('[data-cz-cod]')) continue;
      if (ehClicavel(n)) return n;
      var dentro = n.querySelector('button,[role="button"]');
      if (dentro) return dentro;
    }
    return null;
  }

  function fallback(){
    var main = document.getElementById('MainContent') || document.querySelector('main');
    if (main && main.scrollIntoView){
      main.scrollIntoView({ behavior:'smooth', block:'start' });
    } else {
      window.scrollTo(0, 0);
    }
  }

  document.addEventListener('click', function (e){
    var trigger = e.target.closest ? e.target.closest('[data-cz-cod]') : null;
    if (!trigger) return;
    e.preventDefault();

    var btn = findReleasitButton();
    if (btn){ btn.click(); return; }
    fallback();
  }, false);
})();
</script>
