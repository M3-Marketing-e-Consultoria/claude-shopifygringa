<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cz-cream:#FAF6F0;
    --cz-ink:#2A1F19;
    --cz-ink-soft:#6B5D52;
    --cz-gold:#B8873B;
    --cz-gold-light:#E0B766;
    --cz-green:#16A34A;
    --cz-green-dark:#12833B;
    --cz-cream-text:#F3E7D6;
    --cz-cream-text-soft:#C4B4A3;
    --cz-serif:'Cormorant Garamond',Georgia,serif;
    --cz-sans:'Jost',system-ui,sans-serif;
  }
  /* Botao de compra compartilhado por todos os blocos */
  .cz-cod{
    display:inline-block;background:var(--cz-green,#16A34A);color:#fff;
    font-family:var(--cz-sans,'Jost',sans-serif);font-size:16px;font-weight:600;
    letter-spacing:.06em;text-decoration:none;text-align:center;
    padding:17px 40px;border:0;border-radius:10px;cursor:pointer;
    -webkit-appearance:none;appearance:none;
  }
  .cz-cod:hover{background:var(--cz-green-dark,#12833B)}
  .cz-cod--full{display:block;width:100%;max-width:420px;margin-left:auto;margin-right:auto;font-size:17px;padding:19px 24px}
</style>

<script>
/* =====================================================================
   Abre o formulario do Releasit COD a partir de qualquer botao que
   tenha o atributo data-cz-cod.

   COMO LIGAR — escolha UM dos dois caminhos:

   CAMINHO A (recomendado, sem codigo)
     No app Releasit, procure a opcao de abrir o formulario por um
     seletor customizado (costuma chamar "custom button" / "open form
     on click of"). Cole la:   [data-cz-cod]
     Pronto. Pode deixar RELEASIT_SELECTOR vazio abaixo.

   CAMINHO B (se o app nao tiver essa opcao)
     Abra a pagina do produto no computador, clique com o botao direito
     no botao do Releasit, "Inspecionar", e copie o seletor dele
     (algo como  #releasit-cod-form-btn  ou  .releasit-cod-button ).
     Cole esse seletor em RELEASIT_SELECTOR abaixo. O script passa a
     repassar o clique para aquele botao.

   Se nenhum dos dois estiver configurado, o botao rola a pagina ate a
   caixa de compra do tema — nunca fica morto.
   ===================================================================== */
(function () {
  'use strict';

  var RELEASIT_SELECTOR = '';   // <- CAMINHO B: cole aqui o seletor real

  // Palpites usados so quando RELEASIT_SELECTOR esta vazio. Sao tentativas,
  // nao uma API oficial: se nenhuma casar, o botao apenas rola a pagina.
  var GUESSES = [
    '[data-releasit-cod-form-button]',
    '[id*="releasit"][role="button"]',
    'button[class*="releasit"]',
    'a[class*="releasit"]',
    '[class*="cod-form"] button',
    '#cod-form-button'
  ];

  function findReleasitButton() {
    if (RELEASIT_SELECTOR) return document.querySelector(RELEASIT_SELECTOR);
    for (var i = 0; i < GUESSES.length; i++) {
      var el = document.querySelector(GUESSES[i]);
      if (el && !el.hasAttribute('data-cz-cod')) return el;   // nunca a si mesmo
    }
    return null;
  }

  function fallback() {
    var main = document.getElementById('MainContent') || document.querySelector('main');
    if (main && main.scrollIntoView) {
      main.scrollIntoView({ behavior: 'smooth', block: 'start' });
    } else {
      window.scrollTo(0, 0);
    }
  }

  document.addEventListener('click', function (e) {
    var trigger = e.target.closest ? e.target.closest('[data-cz-cod]') : null;
    if (!trigger) return;
    e.preventDefault();

    var btn = findReleasitButton();
    if (btn) { btn.click(); return; }   // abre o popup do Releasit
    fallback();                          // nada encontrado: rola ate a compra
  }, false);
})();
</script>
