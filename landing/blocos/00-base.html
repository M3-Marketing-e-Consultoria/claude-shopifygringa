<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cz-cream:#FAF6F0;
    --cz-ink:#2A1F19;
    --cz-ink-soft:#6B5D52;
    --cz-gold:#B8873B;
    --cz-gold-light:#E0B766;
    --cz-green:#16A34A;
    --cz-green-dark:#12833B;
    --cz-cream-text:#F3E7D6;
    --cz-cream-text-soft:#C4B4A3;
    --cz-serif:'Cormorant Garamond',Georgia,serif;
    --cz-sans:'Jost',system-ui,sans-serif;
  }

  /* Botao de compra — abre o formulario do Releasit COD.
     Mesmo desenho do botao nativo do app: icone + titulo + subtitulo. */
  .cz-cod{
    display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;max-width:420px;margin:0 auto;
    background:var(--cz-green,#16A34A);color:#fff;
    font-family:var(--cz-sans,'Jost',sans-serif);
    padding:14px 22px;border:0;border-radius:10px;cursor:pointer;
    text-align:center;text-decoration:none;
    -webkit-appearance:none;appearance:none;
  }
  .cz-cod:hover{background:var(--cz-green-dark,#12833B)}
  .cz-cod__icon{width:24px;height:24px;flex:0 0 auto;fill:currentColor}
  .cz-cod__label{font-size:17px;font-weight:600;letter-spacing:.05em;line-height:1.2}
  .cz-cod__sub{display:block;margin:3px 0 0;font-size:12px;font-weight:400;opacity:.9;letter-spacing:0}
</style>

<script>
/* =====================================================================
   Abre o formulario do Releasit COD a partir de qualquer botao que
   tenha o atributo data-cz-cod.

   O seletor abaixo veio do botao real da loja:
       <button id="rsi_buy_now_button" class="sc-iJKPHa jsUlpn ...">
   Usamos o ID, nao as classes: "sc-iJKPHa" e "jsUlpn" sao hashes de
   styled-components e mudam a cada atualizacao do app.

   IMPORTANTE: o botao do Releasit precisa EXISTIR na pagina para o
   clique ser repassado. Ele e renderizado junto do formulario de
   produto do tema. Se a pagina nao tiver o botao, este script rola
   ate a caixa de compra em vez de falhar em silencio.
   ===================================================================== */
(function () {
  'use strict';

  var SELECTORS = [
    '#rsi_buy_now_button',   // botao do Releasit (ID oficial)
    '[id^="rsi_"][id$="_button"]'   // reserva, caso o ID ganhe sufixo
  ];

  function findReleasitButton(){
    for (var i = 0; i < SELECTORS.length; i++){
      var el = document.querySelector(SELECTORS[i]);
      if (el && !el.hasAttribute('data-cz-cod')) return el;
    }
    return null;
  }

  function fallback(){
    var main = document.getElementById('MainContent') || document.querySelector('main');
    if (main && main.scrollIntoView){
      main.scrollIntoView({ behavior:'smooth', block:'start' });
    } else {
      window.scrollTo(0, 0);
    }
  }

  document.addEventListener('click', function (e){
    var trigger = e.target.closest ? e.target.closest('[data-cz-cod]') : null;
    if (!trigger) return;
    e.preventDefault();

    var btn = findReleasitButton();
    if (btn){ btn.click(); return; }
    fallback();
  }, false);
})();
</script>
