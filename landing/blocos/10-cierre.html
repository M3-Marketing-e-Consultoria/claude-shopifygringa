<div class="cz-cierre">
  <style>
    .cz-cierre{
      box-sizing:border-box;background:var(--cz-ink,#2A1F19);
      font-family:var(--cz-sans,'Jost',sans-serif);padding:52px 20px;text-align:center;
    }
    .cz-cierre *,.cz-cierre *::before,.cz-cierre *::after{box-sizing:border-box}
    .cz-cierre img{
      width:100%;max-width:420px;aspect-ratio:1/1;object-fit:cover;
      border-radius:16px;display:block;margin:0 auto 18px;
    }
    .cz-cierre__eyebrow{
      margin:0 0 10px;font-size:12px;font-weight:700;letter-spacing:.16em;
      text-transform:uppercase;color:var(--cz-gold,#B8873B);
    }
    .cz-cierre__title{
      margin:0 0 12px;font-family:var(--cz-serif,serif);font-size:30px;font-weight:600;
      line-height:1.18;color:var(--cz-cream-text,#F3E7D6);
    }
    .cz-cierre__text{
      margin:0 auto 20px;max-width:480px;font-size:15px;line-height:1.7;
      color:var(--cz-cream-text-soft,#C4B4A3);
    }
    .cz-cierre__prices{
      display:flex;align-items:center;justify-content:center;gap:12px;
      flex-wrap:wrap;margin-bottom:18px;
    }
    .cz-cierre__was{font-size:16px;color:#9C8B79;text-decoration:line-through}
    .cz-cierre__now{font-size:36px;font-weight:600;color:var(--cz-cream-text,#F3E7D6);line-height:1.1}
    .cz-cierre__off{
      background:#C0392B;color:#fff;font-size:13px;font-weight:700;
      padding:5px 11px;border-radius:999px;letter-spacing:.04em;
    }    .cz-cierre__note{margin:14px 0 0;font-size:12px;color:#9C8B79}
  </style>

  <img src="https://cdn.shopify.com/s/files/1/0996/2271/5697/files/ChatGPTImage2deset.de2026_15_45_35.png?v=1788374883&width=800"
       alt="Morral y cosmetiquera en Cuero Dacota color cognac, set completo"
       loading="lazy" width="800" height="800">

  <p class="cz-cierre__eyebrow">Últimas unidades</p>
  <h2 class="cz-cierre__title">Llévate el set completo hoy</h2>
  <p class="cz-cierre__text">Morral y cosmetiquera en Cuero Dacota Premium, en el color que elijas. Pagas cuando lo recibes en tu casa.</p>

  <div class="cz-cierre__prices">
    <span class="cz-cierre__was">$699.000</span>
    <span class="cz-cierre__now">$159.000</span>
    <span class="cz-cierre__off">77% OFF</span>
  </div>

  <button type="button" class="cz-cod" data-cz-cod onclick="var b=document.getElementById('rsi_buy_now_button');if(b){b.click()}else{var m=document.getElementById('MainContent')||document.body;m.scrollIntoView({behavior:'smooth',block:'start'})}">
    <svg class="cz-cod__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.55 13c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.37-.66-.11-1.48-.87-1.48H5.21l-.94-2H1v2h2l3.6 7.59-1.35 2.44C4.52 15.37 5.48 17 7 17h12v-2H7l1.1-2h7.45zM6.16 6h12.15l-2.76 5H8.53L6.16 6zM7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zm10 0c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
    <span class="cz-cod__label">COMPRAR AHORA<span class="cz-cod__sub">Realiza tu pedido contra entrega</span></span>
  </button>
  <p class="cz-cierre__note">Envío gratis · Pago contra entrega · 5 años de garantía</p>
</div>
