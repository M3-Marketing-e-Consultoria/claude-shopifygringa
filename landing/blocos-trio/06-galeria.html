<div class="cz-gal">
  <style>
    .cz-gal{
      box-sizing:border-box;background:#fff;
      font-family:var(--cz-sans,'Jost',sans-serif);padding:52px 20px;text-align:center;
    }
    .cz-gal *,.cz-gal *::before,.cz-gal *::after{box-sizing:border-box}
    .cz-gal__eyebrow{
      margin:0 0 10px;font-size:12px;font-weight:700;letter-spacing:.16em;
      text-transform:uppercase;color:var(--cz-gold,#C08B3E);
    }
    .cz-gal__title{
      margin:0 0 12px;font-family:var(--cz-serif,serif);font-size:32px;
      font-weight:700;line-height:1.15;color:var(--cz-ink,#241A14);
    }
    .cz-gal__text{
      margin:0 auto 22px;max-width:520px;font-size:15px;line-height:1.7;
      color:var(--cz-ink-soft,#6B5D52);
    }
    .cz-gal__grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
    .cz-gal__grid img{
      width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:14px;display:block;
    }
  </style>

  <p class="cz-gal__eyebrow">Míralo de cerca</p>
  <h2 class="cz-gal__title">Calidad que se ve<br>y se siente</h2>
  <p class="cz-gal__text">Cuero legítimo, herrajes parejos y acabados que aguantan el uso diario.</p>

  <div class="cz-gal__grid">
    <img src="https://cdn.shopify.com/s/files/1/0996/2271/5697/files/ChatGPT_Image_19_de_jul._de_2026_17_42_58.png?v=1784496576&width=1000" alt="Trío Vélez en cuero, vista de las tres piezas" loading="lazy" width="800" height="800">
    <img src="https://cdn.shopify.com/s/files/1/0996/2271/5697/files/ChatGPT_Image_19_de_jul._de_2026_17_45_00.png?v=1784496576&width=1000" alt="Detalle del cuero y las costuras del Trío Vélez" loading="lazy" width="800" height="800">
    <img src="https://cdn.shopify.com/s/files/1/0996/2271/5697/files/ChatGPT_Image_19_de_jul._de_2026_18_00_47.png?v=1784496576&width=1000" alt="Bolso de mano del Trío Vélez en cuero" loading="lazy" width="800" height="800">
    <img src="https://cdn.shopify.com/s/files/1/0996/2271/5697/files/ChatGPT_Image_19_de_jul._de_2026_18_08_39.png?v=1784496576&width=1000" alt="Bolso carriel y cosmetiquera del Trío Vélez" loading="lazy" width="800" height="800">
  </div>
</div>
