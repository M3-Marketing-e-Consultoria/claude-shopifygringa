<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cz-cream:#FAF6F0;
    --cz-ink:#241A14;
    --cz-ink-soft:#6B5D52;
    --cz-gold:#C08B3E;
    --cz-gold-light:#E8C57A;
    --cz-red:#B3261E;
    --cz-green:#16A34A;
    --cz-green-dark:#12833B;
    --cz-cream-text:#F5E9D7;
    --cz-cream-text-soft:#C9B9A4;
    --cz-serif:'Cormorant Garamond',Georgia,serif;
    --cz-sans:'Jost',system-ui,sans-serif;
  }

  /* Boton de compra — abre el formulario del Releasit COD. */
  .cz-cod{
    display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;max-width:420px;margin:0 auto;
    background:var(--cz-green,#16A34A);color:#fff;
    font-family:var(--cz-sans,'Jost',sans-serif);
    padding:14px 22px;border:0;border-radius:10px;cursor:pointer;
    text-align:center;text-decoration:none;
    -webkit-appearance:none;appearance:none;
  }
  .cz-cod:hover{background:var(--cz-green-dark,#12833B)}
  .cz-cod__icon{width:24px;height:24px;flex:0 0 auto;fill:currentColor}
  .cz-cod__label{font-size:17px;font-weight:600;letter-spacing:.05em;line-height:1.2}
  .cz-cod__sub{display:block;margin:3px 0 0;font-size:12px;font-weight:400;opacity:.9;letter-spacing:0}
</style>
