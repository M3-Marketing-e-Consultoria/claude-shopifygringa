<div class="cz-cal">
  <style>
    .cz-cal{
      box-sizing:border-box;background:var(--cz-ink,#241A14);
      font-family:var(--cz-sans,'Jost',sans-serif);padding:52px 20px;
    }
    .cz-cal *,.cz-cal *::before,.cz-cal *::after{box-sizing:border-box}
    .cz-cal__eyebrow{
      margin:0 0 10px;font-size:12px;font-weight:700;letter-spacing:.16em;
      text-transform:uppercase;color:var(--cz-gold,#C08B3E);text-align:center;
    }
    .cz-cal__title{
      margin:0 0 22px;font-family:var(--cz-serif,serif);font-size:33px;font-weight:700;
      line-height:1.14;color:var(--cz-cream-text,#F5E9D7);text-align:center;
    }
    .cz-cal__img{
      width:100%;max-width:520px;aspect-ratio:4/3;object-fit:cover;
      border-radius:16px;display:block;margin:0 auto 24px;
    }
    .cz-cal__grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:680px;margin:0 auto}
    .cz-cal__item{
      background:#33251B;border:1px solid #4A3728;border-radius:14px;padding:20px 16px;text-align:center;
    }
    .cz-cal__ico{font-size:24px;line-height:1;margin-bottom:8px}
    .cz-cal__h{
      margin:0 0 5px;font-size:14px;font-weight:600;line-height:1.3;
      color:var(--cz-gold-light,#E8C57A);
    }
    .cz-cal__p{margin:0;font-size:12.5px;line-height:1.5;color:var(--cz-cream-text-soft,#C9B9A4)}
    @media (min-width:768px){ .cz-cal__grid{grid-template-columns:repeat(4,1fr)} }
  </style>

  <p class="cz-cal__eyebrow">Hecho para durar</p>
  <h2 class="cz-cal__title">Cada detalle refleja calidad</h2>

  <!-- ⬇⬇ CAMBIA ESTA URL por una foto de detalle (cremallera, costura, logo) ⬇⬇ -->
  <img class="cz-cal__img"
       src="PEGA_AQUI_LA_URL_DE_LA_FOTO_DE_DETALLE"
       alt="Detalle de la costura y la cremallera del bolso en cuero"
       loading="lazy" width="800" height="600">

  <div class="cz-cal__grid">
    <div class="cz-cal__item">
      <div class="cz-cal__ico">🧵</div>
      <h3 class="cz-cal__h">Costuras reforzadas</h3>
      <p class="cz-cal__p">No ceden con el peso del día a día</p>
    </div>
    <div class="cz-cal__item">
      <div class="cz-cal__ico">⚙️</div>
      <h3 class="cz-cal__h">Cremalleras premium</h3>
      <p class="cz-cal__p">Abren y cierran suave, sin trabarse</p>
    </div>
    <div class="cz-cal__item">
      <div class="cz-cal__ico">✨</div>
      <h3 class="cz-cal__h">Acabado impecable</h3>
      <p class="cz-cal__p">Bordes sellados y herrajes parejos</p>
    </div>
    <div class="cz-cal__item">
      <div class="cz-cal__ico">🏅</div>
      <h3 class="cz-cal__h">Cuero de alta calidad</h3>
      <p class="cz-cal__p">Con el uso toma más carácter</p>
    </div>
  </div>
</div>
